[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ballpark"
version = "0.0.0"
description = "Sphere decomposition for collision approximation"
readme = "README.md"
license = { text="MIT" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
dependencies = [
    "numpy>=2.0",
    "trimesh",
    "scikit-learn",
    "scipy",
    "jax>=0.4.0",
    "jax_dataclasses",
    "jaxlib",
    "jaxlie",
    "jaxls @ git+ssh://git@github.com/brentyi/jaxls.git",
    "optax",
    "loguru",
    "yourdfpy",
]

[project.optional-dependencies]
examples = [
    "robot_descriptions",
    "tyro",
    "viser",
]
dev = [
    "pyright>=1.1.308",
    "ruff",
    "pytest",
]


[tool.ty.src]
include = ["./", "src/", "tests/"]
exclude = [".venv/"]
